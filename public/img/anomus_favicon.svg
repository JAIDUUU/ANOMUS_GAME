<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1038"/>
    </linearGradient>
    <linearGradient id="fav-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="32" fill="url(#fav-bg)" stroke="#8b5cf6" stroke-width="4"/>
  
  <!-- Mascot Body -->
  <g transform="translate(6, 12)">
    <ellipse cx="58" cy="64" rx="42" ry="40" fill="url(#fav-body)"/>
    <ellipse cx="58" cy="64" rx="40" ry="38" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>

    <!-- Beret Hat -->
    <g transform="translate(34, 12) rotate(-14)">
      <ellipse cx="28" cy="18" rx="34" ry="14" fill="#1e1b4b" stroke="#7c3aed" stroke-width="3"/>
      <ellipse cx="28" cy="16" rx="26" ry="9" fill="#4338ca"/>
      <path d="M 28 6 L 28 2" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Eyes -->
    <ellipse cx="42" cy="62" rx="8" ry="11" fill="#0f172a"/>
    <ellipse cx="40" cy="58" rx="3.5" ry="5" fill="#ffffff"/>
    
    <ellipse cx="74" cy="62" rx="8" ry="11" fill="#0f172a"/>
    <ellipse cx="72" cy="58" rx="3.5" ry="5" fill="#ffffff"/>

    <!-- Cheeks & Smile -->
    <ellipse cx="30" cy="72" rx="6" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="86" cy="72" rx="6" ry="4" fill="#f43f5e" opacity="0.6"/>
    <path d="M 50 72 Q 58 84 66 72 Z" fill="#ef4444" stroke="#0f172a" stroke-width="2"/>
    
    <!-- Brush Tip -->
    <circle cx="98" cy="52" r="7" fill="#22d3ee"/>
    <circle cx="104" cy="46" r="3" fill="#fef08a"/>
  </g>
</svg>
